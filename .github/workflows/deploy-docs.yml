name: Deploy documentation/docs/web to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "documentation/docs/web/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Verify and deploy documentation
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify static documentation
        run: |
          test -f documentation/docs/web/index.html
          test -f documentation/docs/web/style.css
          test -f documentation/docs/web/script.js
          test -f documentation/docs/web/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload documentation website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./documentation/docs/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
